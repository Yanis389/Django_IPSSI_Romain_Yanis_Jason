<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de la Série - SerieMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/shows/search/">🎬 SerieMatch</a>
        </div>
    </nav>

    <div class="container" id="show-details">
        <p class="text-center text-muted">Chargement de la série...</p>
    </div>

    <script>
        // Django passe l'ID de la série dans le template via la vue views.py   
        const showId = parseInt("{{ show_id }}", 10);

        const fetchShowDetail = async () => {
            const response = await fetch(`/api/shows/${showId}/`);
            const show = await response.json();
            const container = document.getElementById('show-details');
            
            const poster = show.poster_url ? show.poster_url : 'https://via.placeholder.com/500x750?text=Pas+d+image';
            
            // Générer le HTML pour les recommandations (similar_shows)
            let recommendationsHtml = '';
            if (show.similar_shows && show.similar_shows.length > 0) {
                recommendationsHtml = '<h4 class="mt-5 mb-3">Séries similaires (Recommandation TF-IDF)</h4><div class="row">';
                show.similar_shows.forEach(sim => {
                    const simPoster = sim.poster_url ? sim.poster_url : 'https://via.placeholder.com/500x750?text=Image';
                    recommendationsHtml += `
                        <div class="col-md-2 col-4 mb-3">
                            <a href="/shows/${sim.id}/" class="text-decoration-none">
                                <div class="card h-100 border-0 shadow-sm">
                                    <img src="${simPoster}" class="card-img-top rounded" alt="${sim.title}">
                                    <div class="card-body p-2 text-center">
                                        <p class="card-text small text-dark fw-bold mb-0" style="font-size:0.8rem;">${sim.title}</p>
                                    </div>
                                </div>
                            </a>
                        </div>
                    `;
                });
                recommendationsHtml += '</div>';
            }

            // Générer l'affichage principal
            container.innerHTML = `
                <a href="/shows/search/" class="btn btn-sm btn-outline-secondary mb-3">&larr; Retour à la recherche</a>
                <div class="card shadow-sm border-0 mb-4">
                    <div class="row g-0">
                        <div class="col-md-4">
                            <img src="${poster}" class="img-fluid rounded-start w-100" alt="${show.title}">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h2 class="card-title">${show.title} <span class="text-muted fs-4">(${show.first_air_date ? show.first_air_date.substring(0,4) : 'N/A'})</span></h2>
                                <p class="mb-2">
                                    <span class="badge bg-primary">⭐ ${show.vote_average.toFixed(1)}/10</span>
                                    <span class="badge bg-secondary">${show.number_of_seasons} Saison(s)</span>
                                    <span class="badge bg-info text-dark">${show.status}</span>
                                </p>
                                <p class="text-muted small"><strong>Genres :</strong> ${show.genres.join(', ')}</p>
                                <h5 class="mt-4">Synopsis</h5>
                                <p class="card-text">${show.synopsis || "Aucun synopsis disponible pour cette série."}</p>
                            </div>
                        </div>
                    </div>
                </div>
                ${recommendationsHtml}
            `;
        };

        fetchShowDetail();
    </script>
</body>
</html>
