{% extends "base.html" %}
{% load static %}

{% block title %}Fiche série — SérieMatch{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/shows.css' %}">
{% endblock %}

{% block content %}
<a class="retour" href="/shows/search/">&larr; Retour à la recherche</a>

<div id="show-details">
    <p class="vide">Chargement de la série…</p>
</div>

<section class="similaires" id="similaires" hidden>
    <h2>Séries similaires <span class="vide">— calculées par TF-IDF</span></h2>
    <div class="carrousel" id="similaires-liste"></div>
</section>
{% endblock %}

{% block extra_js %}
<script>
// Django passe l'ID de la serie dans le template via la vue
const showId = parseInt("{{ show_id }}", 10);

const conteneur = document.getElementById('show-details');

function afficherFiche(show) {
    const note = show.vote_average ? show.vote_average.toFixed(1) : '—';
    const annee = show.first_air_date ? show.first_air_date.substring(0, 4) : 'N/A';
    const affiche = show.poster_url
        ? `<img class="fiche-affiche" src="${show.poster_url}" alt="${show.title}">`
        : '<div class="poster-vide" style="width:100%;height:420px;">Pas d\'affiche</div>';

    conteneur.innerHTML = `
        <article class="fiche">
            <div>${affiche}</div>
            <div>
                <h1>${show.title} <span class="annee">(${annee})</span></h1>
                <div class="badges">
                    <span class="badge badge-note">★ ${note} / 10</span>
                    ${show.number_of_seasons ? `<span class="badge">${show.number_of_seasons} saison(s)</span>` : ''}
                    ${show.status ? `<span class="badge">${show.status}</span>` : ''}
                </div>
                <p class="fiche-genres"><strong>Genres :</strong> ${show.genres.join(', ') || '—'}</p>
                <h2>Synopsis</h2>
                <p class="fiche-synopsis">${show.synopsis || "Aucun synopsis disponible pour cette série."}</p>
                <div class="zone-watchlist" id="zone-watchlist"></div>
            </div>
        </article>
    `;
}

function afficherSimilaires(shows) {
    if (!shows || shows.length === 0) return;
    document.getElementById('similaires-liste').innerHTML = shows.map(carteSerie).join('');
    document.getElementById('similaires').hidden = false;
}

// Bloc « ajouter a une liste » : depend des watchlists de l'utilisateur connecte
async function afficherWatchlist() {
    const zone = document.getElementById('zone-watchlist');
    if (!zone) return;

    const reponse = await fetch('/api/watchlists/');
    if (!reponse.ok) {
        zone.innerHTML = '<a class="btn btn-fantome" href="/connexion/">Connecte-toi pour ajouter à une liste</a>';
        return;
    }

    const listes = await reponse.json();
    if (listes.length === 0) {
        zone.innerHTML = '<a class="btn btn-fantome" href="/watchlists/">Crée d\'abord une liste</a>';
        return;
    }

    zone.innerHTML = `
        <div class="ajout-liste">
            <select id="choix-liste" aria-label="Choisir une liste">
                ${listes.map(l => `<option value="${l.id}">${l.name}</option>`).join('')}
            </select>
            <button type="button" id="btn-ajouter">Ajouter</button>
        </div>
        <p id="retour-watchlist" class="message"></p>
    `;

    document.getElementById('btn-ajouter').addEventListener('click', () => {
        const listeId = document.getElementById('choix-liste').value;
        const retour = document.getElementById('retour-watchlist');
        apiPost(`/api/watchlists/${listeId}/entries/`, {show_id: showId})
            .then(r => r.json().then(body => ({ok: r.ok, body})))
            .then(({ok, body}) => {
                retour.className = ok ? 'message ok' : 'message';
                retour.textContent = ok ? 'Ajoutée à la liste.' : (body.error || 'Erreur');
            })
            .catch(() => {
                retour.className = 'message';
                retour.textContent = 'Erreur réseau.';
            });
    });
}

fetch(`/api/shows/${showId}/`)
    .then(r => r.json())
    .then(show => {
        afficherFiche(show);
        afficherSimilaires(show.similar_shows);
        return afficherWatchlist();
    })
    .catch(() => {
        conteneur.innerHTML = '<p class="message">Impossible de charger cette série.</p>';
    });
</script>
{% endblock %}
