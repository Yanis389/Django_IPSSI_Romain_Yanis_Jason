<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Séries - SerieMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/shows/search/">🎬 SerieMatch</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Sidebar : Filtres -->
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Filtres</h5>
                        <form id="search-form">
                            <div class="mb-2">
                                <label class="form-label">Genre</label>
                                <input type="text" name="genre" class="form-control" placeholder="Ex: Drame, Comédie...">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Année</label>
                                <input type="text" name="year" class="form-control" placeholder="Ex: 2020 ou 2010s">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Note Minimum</label>
                                <input type="number" step="0.1" name="min_rating" class="form-control" placeholder="Ex: 8.0">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-3">Rechercher</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Résultats de recherche -->
            <div class="col-md-9">
                <div class="row" id="results">
                    <p class="text-center text-muted">Chargement des séries...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fetchShows = async (queryString = '') => {
            const response = await fetch(`/api/shows/search/${queryString}`);
            const data = await response.json();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (data.results.length === 0) {
                resultsDiv.innerHTML = '<p class="text-center">Aucune série trouvée.</p>';
                return;
            }

            // Générer les cartes pour chaque série
            data.results.forEach(show => {
                const poster = show.poster_url ? show.poster_url : 'https://via.placeholder.com/500x750?text=Pas+d+image';
                const card = `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm">
                            <img src="${poster}" class="card-img-top" alt="${show.title}">
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title">${show.title}</h6>
                                <p class="card-text text-muted small">⭐ ${show.vote_average.toFixed(1)}/10 | ${show.first_air_date ? show.first_air_date.substring(0,4) : 'N/A'}</p>
                                <a href="/shows/${show.id}/" class="btn btn-outline-primary mt-auto btn-sm">Voir Détails</a>
                            </div>
                        </div>
                    </div>
                `;
                resultsDiv.innerHTML += card;
            });
        };

        // Gérer la soumission du formulaire
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const params = new URLSearchParams();
            for (let [key, value] of formData.entries()) {
                if (value) params.append(key, value);
            }
            fetchShows('?' + params.toString());
        });

        // Charger les séries au lancement
        fetchShows();
    </script>
</body>
</html>
